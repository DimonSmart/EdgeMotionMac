name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Test Swift package
        run: swift test --configuration release
      - name: Check packaging scripts
        run: bash -n scripts/package-macos-app.sh scripts/render-homebrew-cask.sh
      - name: Build universal app bundle
        run: bash scripts/package-macos-app.sh 0.0.0 "$RUNNER_TEMP/package"
      - name: Verify packaged app
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/package/EdgeMotion.app"
          test -f "$app/Contents/Info.plist"
          test -x "$app/Contents/MacOS/EdgeMotion"
          test "$(/usr/bin/lipo -archs "$app/Contents/MacOS/EdgeMotion")" = "x86_64 arm64" \
            || test "$(/usr/bin/lipo -archs "$app/Contents/MacOS/EdgeMotion")" = "arm64 x86_64"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$app/Contents/Info.plist")" = "true"
