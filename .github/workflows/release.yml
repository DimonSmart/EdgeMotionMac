name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: edgemotion-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected vMAJOR.MINOR.PATCH tag"; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "The tag must point to a commit on main"; exit 1; }
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Require Apple release credentials
        shell: bash
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          for name in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD DEVELOPER_ID_IDENTITY APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8_BASE64; do
            [[ -n "${!name}" ]] || { echo "::error::Missing release secret $name"; exit 1; }
          done

      - name: Test Swift package
        run: swift test --configuration release

      - name: Build universal app
        run: bash scripts/package-macos-app.sh "$VERSION" "$RUNNER_TEMP/package"

      - name: Sign, notarize, staple and package
        shell: bash
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/package/EdgeMotion.app"
          signing="$RUNNER_TEMP/edge-signing"
          mkdir -p "$signing"
          keychain="$signing/release.keychain-db"
          password="$(/usr/bin/uuidgen)"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true; rm -rf "$signing"' EXIT

          printf '%s' "$DEVELOPER_ID_P12_BASE64" | /usr/bin/base64 -D > "$signing/cert.p12"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | /usr/bin/base64 -D > "$signing/AuthKey_$APPLE_API_KEY_ID.p8"
          chmod 600 "$signing/AuthKey_$APPLE_API_KEY_ID.p8"
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security list-keychains -d user -s "$keychain"
          security import "$signing/cert.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"

          /usr/bin/codesign --force --timestamp --options runtime --sign "$DEVELOPER_ID_IDENTITY" "$app/Contents/MacOS/EdgeMotion"
          /usr/bin/codesign --force --timestamp --options runtime --sign "$DEVELOPER_ID_IDENTITY" "$app"
          /usr/bin/codesign --verify --strict --verbose=2 "$app"

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$app" "$signing/submit.zip"
          xcrun notarytool submit "$signing/submit.zip" \
            --key "$signing/AuthKey_$APPLE_API_KEY_ID.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait --output-format json > "$signing/notary-result.json"
          cat "$signing/notary-result.json"
          jq -e '.status == "Accepted"' "$signing/notary-result.json" >/dev/null
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          /usr/bin/codesign --verify --strict --verbose=2 "$app"

          asset="EdgeMotion-$GITHUB_REF_NAME-macos-universal.zip"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/$asset"
          (cd "$RUNNER_TEMP" && shasum -a 256 "$asset" > SHA256SUMS.txt)
          echo "ASSET_PATH=$RUNNER_TEMP/$asset" >> "$GITHUB_ENV"
          echo "CHECKSUMS_PATH=$RUNNER_TEMP/SHA256SUMS.txt" >> "$GITHUB_ENV"
          echo "ASSET_SHA256=$(shasum -a 256 "$RUNNER_TEMP/$asset" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "$ASSET_PATH" "$CHECKSUMS_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "EdgeMotion $GITHUB_REF_NAME" --generate-notes

      - name: Update Homebrew Cask in main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C update-homebrew origin/main
          bash scripts/render-homebrew-cask.sh "$VERSION" "$ASSET_SHA256" "Casks/edgemotion.rb"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/edgemotion.rb
          if git diff --cached --quiet; then
            echo "Cask is already current"
          else
            git commit -m "Update Homebrew Cask for $GITHUB_REF_NAME"
            git push origin HEAD:main
          fi
