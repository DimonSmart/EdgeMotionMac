name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: edgemotion-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected vMAJOR.MINOR.PATCH tag"; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "The tag must point to a commit on main"; exit 1; }
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"


      - name: Test Swift package
        run: swift test --configuration release

      - name: Build universal app
        run: bash scripts/package-macos-app.sh "$VERSION" "$RUNNER_TEMP/package"


      - name: Package unsigned app and checksum
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/package/EdgeMotion.app"
          test -x "$app/Contents/MacOS/EdgeMotion"
          /usr/bin/lipo "$app/Contents/MacOS/EdgeMotion" -verify_arch arm64 x86_64
          asset="EdgeMotion-$GITHUB_REF_NAME-macos-universal.zip"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/$asset"
          (cd "$RUNNER_TEMP" && shasum -a 256 "$asset" > SHA256SUMS.txt)
          echo "ASSET_PATH=$RUNNER_TEMP/$asset" >> "$GITHUB_ENV"
          echo "CHECKSUMS_PATH=$RUNNER_TEMP/SHA256SUMS.txt" >> "$GITHUB_ENV"
          echo "ASSET_SHA256=$(shasum -a 256 "$RUNNER_TEMP/$asset" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ASSET_PATH" "$CHECKSUMS_PATH" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ASSET_PATH" "$CHECKSUMS_PATH" \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "EdgeMotion $GITHUB_REF_NAME" --generate-notes
          fi

      - name: Update Homebrew Cask in main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C update-homebrew origin/main
          bash scripts/render-homebrew-cask.sh "$VERSION" "$ASSET_SHA256" "Casks/edgemotion.rb"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/edgemotion.rb
          if git diff --cached --quiet; then
            echo "Cask is already current"
          else
            git commit -m "Update Homebrew Cask for $GITHUB_REF_NAME"
            git push origin HEAD:main
          fi
